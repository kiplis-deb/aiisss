<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nebula — AI Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>
  <div class="bg-grid"></div>

  <main class="app">
    <header class="app-header glass">
      <div class="brand">
        <a class="brand-mark" href="index.html" title="Back to home" aria-label="Back to home">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L13.5 7.5L19 9L13.5 10.5L12 16L10.5 10.5L5 9L10.5 7.5L12 2Z" fill="currentColor"/>
            <path d="M19 14L19.8 16.2L22 17L19.8 17.8L19 20L18.2 17.8L16 17L18.2 16.2L19 14Z" fill="currentColor"/>
            <path d="M5 14L5.8 16.2L8 17L5.8 17.8L5 20L4.2 17.8L2 17L4.2 16.2L5 14Z" fill="currentColor"/>
          </svg>
        </a>
        <div class="brand-text">
          <h1>Nebula</h1>
          <span class="brand-sub">AI Conversation Interface</span>
        </div>
      </div>

      <div class="header-controls">
        <a class="icon-btn glass-inner" href="index.html" title="Home" aria-label="Home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 11l9-8 9 8"/>
            <path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/>
          </svg>
        </a>
        <div class="select-wrap glass-inner">
          <select id="model-select" aria-label="Select model">
            <optgroup label="Free">
              <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite (free)</option>
              <option value="gemini-2.0-flash">Gemini 2.0 Flash (free tier)</option>
              <option value="gemini-2.5-flash">Gemini 2.5 Flash (free tier)</option>
            </optgroup>
            <optgroup label="Paid">
              <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
              <option value="gemini-2.5-flash-paid">Gemini 2.5 Flash</option>
              <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
            </optgroup>
          </select>
        </div>
        <button id="clear-btn" class="icon-btn glass-inner" title="Clear chat" aria-label="Clear chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/>
            <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
        </button>
      </div>
    </header>

    <nav class="mode-bar glass-inner" role="tablist" aria-label="Mode">
      <div class="mode-bar-label">Modes</div>
      <button class="mode is-active" data-mode="chat" role="tab" aria-selected="true">
        <span class="mode-dot"></span>Chat
      </button>
      <button class="mode" data-mode="thinking" role="tab" aria-selected="false">
        <span class="mode-dot"></span>Thinking
      </button>
      <button class="mode" data-mode="research" role="tab" aria-selected="false">
        <span class="mode-dot"></span>Research
      </button>
      <button class="mode" data-mode="coding" role="tab" aria-selected="false">
        <span class="mode-dot"></span>Advanced Coding
      </button>
      <button class="mode" data-mode="devtools" role="tab" aria-selected="false">
        <span class="mode-dot"></span>Developer Tools
      </button>
    </nav>

    <section class="chat-window glass" id="chat-window">
      <div class="messages" id="messages">
        <div class="welcome">
          <div class="welcome-icon">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2L13.5 7.5L19 9L13.5 10.5L12 16L10.5 10.5L5 9L10.5 7.5L12 2Z" fill="currentColor"/>
            </svg>
          </div>
          <h2 id="welcome-title">Hello, I'm Nebula</h2>
          <p id="welcome-sub">Ask me anything. I'll think, then respond.</p>
          <div class="suggestions" id="suggestions">
            <button class="chip glass-inner" data-prompt="Explain quantum entanglement in simple terms">Explain quantum entanglement</button>
            <button class="chip glass-inner" data-prompt="Write a short poem about the night sky">Poem about the night sky</button>
            <button class="chip glass-inner" data-prompt="Give me 3 ideas for a weekend side project">Weekend project ideas</button>
            <button class="chip glass-inner" data-prompt="What makes glassmorphism look futuristic?">Why does glassmorphism feel futuristic?</button>
          </div>
        </div>
      </div>
    </section>

    <footer class="composer glass">
      <div class="attach-tray" id="attach-tray" hidden></div>
      <form id="composer" class="composer-inner" autocomplete="off">
        <button type="button" id="attach-btn" class="icon-btn ghost" title="Attach images or files" aria-label="Attach">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
          </svg>
        </button>
        <input type="file" id="file-input" hidden multiple
               accept="image/*,.pdf,.txt,.md,.json,.csv,.js,.ts,.py,.html,.css,.xml,.yaml,.yml" />
        <textarea
          id="input"
          rows="1"
          placeholder="Message Nebula…"
          aria-label="Message"
        ></textarea>
        <button type="submit" id="send-btn" class="send-btn" aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2L11 13"/>
            <path d="M22 2L15 22L11 13L2 9L22 2Z"/>
          </svg>
        </button>
      </form>
      <div class="composer-foot">
        <span id="status" class="status">Ready</span>
        <span class="mode-pill" id="mode-pill">Chat</span>
        <span class="kbd-hint"><kbd>Enter</kbd> send · <kbd>Shift</kbd>+<kbd>Enter</kbd> newline</span>
      </div>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
